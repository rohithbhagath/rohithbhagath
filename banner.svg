<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d9ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Floating math / AI symbols -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#3a5a7a" opacity="0.35">
    <text x="60" y="60" font-size="26">∑ wᵢxᵢ + b</text>
    <text x="880" y="50" font-size="24">∇θ J(θ)</text>
    <text x="1000" y="230" font-size="26">σ(z) = 1/(1+e⁻ᶻ)</text>
    <text x="40" y="250" font-size="22">P(y|x)</text>
    <text x="520" y="270" font-size="22">argmax</text>
    <text x="700" y="40" font-size="24">softmax</text>
    <text x="300" y="35" font-size="22">∂L/∂w</text>
    <text x="150" y="150" font-size="20">[Wₓ · h + Wₕ]</text>
    <text x="960" y="150" font-size="20">Attention(Q,K,V)</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#3a5a7a" opacity="0.35">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-6; 0,0" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- Neural network layers -->
  <g stroke="url(#edgeGrad)" stroke-width="1.1" fill="none" opacity="0.8">
    <!-- input -> hidden1 -->
    <path d="M160,70 L430,60"/>
    <path d="M160,70 L430,140"/>
    <path d="M160,70 L430,220"/>
    <path d="M160,150 L430,60"/>
    <path d="M160,150 L430,140"/>
    <path d="M160,150 L430,220"/>
    <path d="M160,230 L430,60"/>
    <path d="M160,230 L430,140"/>
    <path d="M160,230 L430,220"/>
    <!-- hidden1 -> hidden2 -->
    <path d="M430,60 L680,45"/>
    <path d="M430,60 L680,110"/>
    <path d="M430,60 L680,190"/>
    <path d="M430,60 L680,255"/>
    <path d="M430,140 L680,45"/>
    <path d="M430,140 L680,110"/>
    <path d="M430,140 L680,190"/>
    <path d="M430,140 L680,255"/>
    <path d="M430,220 L680,45"/>
    <path d="M430,220 L680,110"/>
    <path d="M430,220 L680,190"/>
    <path d="M430,220 L680,255"/>
    <!-- hidden2 -> output -->
    <path d="M680,45 L960,90"/>
    <path d="M680,110 L960,90"/>
    <path d="M680,190 L960,90"/>
    <path d="M680,255 L960,90"/>
    <path d="M680,45 L960,200"/>
    <path d="M680,110 L960,200"/>
    <path d="M680,190 L960,200"/>
    <path d="M680,255 L960,200"/>
  </g>

  <!-- Traveling pulses along a few key edges -->
  <g fill="#7cf7ff">
    <circle r="3">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M160,70 L430,140 L680,110 L960,90"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3">
      <animateMotion dur="2.6s" begin="0.6s" repeatCount="indefinite" path="M160,150 L430,60 L680,45 L960,90"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3">
      <animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite" path="M160,230 L430,220 L680,255 L960,200"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3">
      <animateMotion dur="2.9s" begin="1.8s" repeatCount="indefinite" path="M160,70 L430,220 L680,190 L960,200"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.9s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Nodes with pulse glow -->
  <g>
    <!-- input layer -->
    <g>
      <circle cx="160" cy="70" r="14" fill="url(#nodeGlow)"/>
      <circle cx="160" cy="70" r="6" fill="#00e5ff"/>
      <circle cx="160" cy="150" r="14" fill="url(#nodeGlow)"/>
      <circle cx="160" cy="150" r="6" fill="#00e5ff"/>
      <circle cx="160" cy="230" r="14" fill="url(#nodeGlow)"/>
      <circle cx="160" cy="230" r="6" fill="#00e5ff"/>
    </g>
    <!-- hidden1 -->
    <g fill="#7c4dff">
      <circle cx="430" cy="60" r="6"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="140" r="6"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="220" r="6"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.7s" repeatCount="indefinite"/></circle>
    </g>
    <!-- hidden2 -->
    <g fill="#ff4dd8">
      <circle cx="680" cy="45" r="6"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="110" r="6"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="190" r="6"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="255" r="6"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>
    <!-- output -->
    <g>
      <circle cx="960" cy="90" r="16" fill="url(#nodeGlow)"/>
      <circle cx="960" cy="90" r="7" fill="#00ffa3"/>
      <circle cx="960" cy="200" r="16" fill="url(#nodeGlow)"/>
      <circle cx="960" cy="200" r="7" fill="#00ffa3"/>
    </g>
  </g>

  <!-- Title text -->
  <text x="600" y="290" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="13" fill="#5a7a99" opacity="0.7">neural network • gradient descent • attention • probability</text>
</svg>
